<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>ShoeShop — Danh sách Đơn hàng</title>
      <link rel="stylesheet" type="text/css" th:href="@{/style.css}" />
      <th:block th:include="_header"></th:block>
      <style>
         @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

         /* ----------------------------------------------------------
            Design Tokens
         ---------------------------------------------------------- */
         :root {
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-size-xs:   12px;
            --font-size-sm:   13.5px;
            --font-size-base: 15px;
            --font-size-md:   17px;
            --font-size-lg:   20px;
            --font-size-xl:   24px;

            --sp-1: 8px;
            --sp-2: 16px;
            --sp-3: 24px;
            --sp-4: 32px;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;

            --color-bg:             #F8FAFC;
            --color-card:           #FFFFFF;
            --color-primary:        #2563EB;
            --color-primary-hover:  #1D4ED8;
            --color-primary-light:  #EFF6FF;
            --color-success:        #16A34A;
            --color-success-light:  #ECFDF5;
            --color-danger:         #DC2626;
            --color-danger-light:   #FEF2F2;
            --color-warning:        #F59E0B;
            --color-warning-light:  #FEF3C7;
            --color-border:         #E2E8F0;
            --color-text:           #0F172A;
            --color-text-secondary: #475569;
            --color-text-muted:     #94A3B8;

            --shadow-soft:   0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.02);
            --shadow-md:     0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg:     0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.02);

            --transition: 200ms ease-in-out;
         }

         body {
            background-color: var(--color-bg);
            font-family: var(--font-family);
            color: var(--color-text);
            margin: 0;
            padding: 0;
         }

         h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-family) !important;
         }

         .dash-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--sp-4) var(--sp-2);
         }

         /* Header & Title */
         .orders-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--sp-4);
            gap: var(--sp-2);
         }
         .orders-title {
            font-size: var(--font-size-xl);
            font-weight: 800;
            color: var(--color-text);
            margin: 0;
            letter-spacing: -0.5px;
         }
         .orders-subtitle {
            font-size: var(--font-size-base);
            color: var(--color-text-secondary);
            margin: 6px 0 0 0;
         }
         .orders-stats-card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 16px 24px;
            box-shadow: var(--shadow-soft);
         }
         .stats-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--color-primary-light);
            color: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
         }
         .stats-label {
            display: block;
            font-size: 11px;
            color: var(--color-text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
         }
         .stats-val {
            display: block;
            font-size: var(--font-size-xl);
            font-weight: 800;
            color: var(--color-text);
            line-height: 1.1;
            margin-top: 2px;
         }

         /* Main Table Card */
         .orders-card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            margin-bottom: var(--sp-4);
         }
         .table-responsive {
            overflow-x: auto;
            width: 100%;
         }
         .orders-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
         }
         .orders-table th {
            background-color: #F8FAFC;
            padding: 16px 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--color-text-secondary);
            border-bottom: 1px solid var(--color-border);
            letter-spacing: 0.5px;
         }
         .orders-table td {
            padding: 16px 20px;
            font-size: var(--font-size-sm);
            color: var(--color-text);
            border-bottom: 1px solid var(--color-border);
            vertical-align: middle;
         }
         .orders-table tbody tr {
            transition: var(--transition);
         }
         .orders-table tbody tr:hover {
            background-color: #F8FAFC;
         }
         .orders-table tbody tr:last-child td {
            border-bottom: none;
         }

         .order-num-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #F1F5F9;
            color: var(--color-text);
            font-weight: 700;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: var(--font-size-sm);
         }
         .order-date-text {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--color-text-secondary);
         }
         .order-date-text i {
            color: var(--color-text-muted);
         }
         .cust-name {
            font-weight: 600;
            color: var(--color-text);
         }
         .cust-address {
            color: var(--color-text-secondary);
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
         }
         .cust-email {
            color: var(--color-text-secondary);
         }
         .order-amount {
            font-weight: 700;
            color: var(--color-primary);
         }

         /* Status Badge styling */
         .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
         }
         .status-pending {
            background-color: var(--color-warning-light);
            color: var(--color-warning);
         }
         .status-completed, .status-delivered {
            background-color: var(--color-success-light);
            color: var(--color-success);
         }
         .status-cancelled, .status-rejected {
            background-color: var(--color-danger-light);
            color: var(--color-danger);
         }

         /* Action Link */
         .btn-view {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background-color: var(--color-primary-light);
            color: var(--color-primary);
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            font-size: var(--font-size-sm);
            font-weight: 600;
            text-decoration: none;
            transition: var(--transition);
         }
         .btn-view:hover {
            background-color: var(--color-primary);
            color: #ffffff;
         }

         /* Pagination styling */
         .page-navigator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: var(--sp-3);
         }
         .page-navigator .nav-item {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 38px;
            height: 38px;
            padding: 0 14px;
            border-radius: var(--radius-sm);
            background-color: var(--color-card);
            border: 1px solid var(--color-border);
            color: var(--color-text-secondary);
            font-weight: 600;
            font-size: var(--font-size-sm);
            text-decoration: none;
            transition: var(--transition);
         }
         .page-navigator .nav-item:hover {
            background-color: var(--color-primary-light);
            color: var(--color-primary);
            border-color: var(--color-primary);
         }
         .page-navigator a.nav-item.active {
            background-color: var(--color-primary);
            color: #ffffff;
            border-color: var(--color-primary);
         }

         /* Responsive */
         @media (max-width: 768px) {
            .orders-header-row {
               flex-direction: column;
               align-items: flex-start;
               gap: 16px;
            }
            .orders-stats-card {
               width: 100%;
               justify-content: flex-start;
            }
            .orders-table th, .orders-table td {
               padding: 12px 16px;
            }
         }
      </style>
   </head>
   <body>
      <th:block th:include="_menu"></th:block>
      
      <div class="dash-container">
         <div class="orders-header-row">
            <div>
               <h1 class="orders-title">Danh sách Đơn hàng</h1>
               <p class="orders-subtitle">Quản lý và theo dõi tiến độ giao nhận của các hóa đơn mua sắm.</p>
            </div>
            <div class="orders-stats-card">
               <div class="stats-icon">
                  <i class="fas fa-shopping-bag"></i>
               </div>
               <div>
                  <span class="stats-label">Tổng đơn hàng</span>
                  <span class="stats-val" th:utext="${paginationResult.totalRecords}">0</span>
               </div>
            </div>
         </div>

         <div class="orders-card">
            <div class="table-responsive">
               <table class="orders-table">
                  <thead>
                     <tr>
                        <th>Mã đơn</th>
                        <th>Ngày đặt</th>
                        <th>Khách hàng</th>
                        <th>Địa chỉ</th>
                        <th>Email</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                     </tr>
                  </thead>
                  <tbody>
                     <tr th:each="orderInfo : ${paginationResult.list}">
                        <td>
                           <span class="order-num-badge" th:utext="${orderInfo.orderNum}"></span>
                        </td>
                        <td>
                           <div class="order-date-text">
                              <i class="far fa-calendar-alt"></i>
                              <span th:utext="${#dates.format(orderInfo.orderDate,'dd-MM-yyyy HH:mm')}"></span>
                           </div>
                        </td>
                        <td>
                           <span class="cust-name" th:utext="${orderInfo.customerName}"></span>
                        </td>
                        <td>
                           <div class="cust-address" th:title="${orderInfo.customerAddress}" th:utext="${orderInfo.customerAddress}"></div>
                        </td>
                        <td>
                           <span class="cust-email" th:utext="${orderInfo.customerEmail}"></span>
                        </td>
                         <td>
                            <span class="order-amount" th:utext="${#numbers.formatDecimal(orderInfo.amount * 1000, 1, 'POINT', 0, 'POINT')} + ' ₫'"></span>
                         </td>
                        <td>
                           <span th:if="${orderInfo.status == 'PENDING' or orderInfo.status == '1'}" class="badge badge-warning px-2.5 py-1 font-weight-bold" style="border-radius: 4px;">Đang chờ xử lý</span>
                           <span th:if="${orderInfo.status == 'COMPLETED' or orderInfo.status == 'DELIVERED'}" class="badge badge-success px-2.5 py-1 font-weight-bold" style="border-radius: 4px;">Hoàn tất</span>
                           <span th:if="${orderInfo.status == 'CANCELLED'}" class="badge badge-danger px-2.5 py-1 font-weight-bold" style="border-radius: 4px;">Đã hủy</span>
                           <span th:if="${orderInfo.status == 'RETURN_PENDING'}" class="badge badge-warning px-2.5 py-1 font-weight-bold" style="border-radius: 4px; background-color: #FEF3C7; color: #D97706;">Chờ duyệt trả hàng</span>
                           <span th:if="${orderInfo.status == 'RETURNED'}" class="badge badge-info px-2.5 py-1 font-weight-bold" style="border-radius: 4px;">Đã trả hàng</span>
                           <span th:if="${orderInfo.status != 'PENDING' and orderInfo.status != '1' and orderInfo.status != 'COMPLETED' and orderInfo.status != 'DELIVERED' and orderInfo.status != 'CANCELLED' and orderInfo.status != 'RETURN_PENDING' and orderInfo.status != 'RETURNED'}" class="status-badge status-pending" th:utext="${orderInfo.status}">PENDING</span>
                        </td>
                        <td>
                           <div class="d-flex align-items-center" style="gap: 6px;">
                              <a th:href="@{|/admin/order?orderId=${orderInfo.id}|}" class="btn-view" title="Xem chi tiết">
                                 <i class="fas fa-eye"></i> Xem
                              </a>
                              
                              <!-- User Cancel button for PENDING orders -->
                              <button th:if="${orderInfo.status == 'PENDING' or orderInfo.status == '1'}" 
                                      class="btn btn-sm btn-outline-danger font-weight-bold" 
                                      style="border-radius: 6px;"
                                      th:onclick="|cancelOrder('${orderInfo.id}')|"
                                      title="Hủy đơn hàng này">
                                 <i class="fas fa-times"></i> Hủy
                              </button>

                              <!-- User Return button for COMPLETED orders -->
                              <button th:if="${orderInfo.status == 'COMPLETED' or orderInfo.status == 'DELIVERED'}" 
                                      class="btn btn-sm btn-outline-warning font-weight-bold text-dark" 
                                      style="border-radius: 6px;"
                                      th:onclick="|openReturnModal('${orderInfo.id}')|"
                                      title="Yêu cầu trả hàng / hoàn tiền">
                                 <i class="fas fa-undo"></i> Trả hàng
                              </button>

                              <!-- Admin Approval buttons for RETURN_PENDING orders -->
                              <th:block sec:authorize="hasRole('ROLE_ADMIN')">
                                 <button th:if="${orderInfo.status == 'RETURN_PENDING'}" 
                                         class="btn btn-sm btn-success font-weight-bold" 
                                         style="border-radius: 6px;"
                                         th:onclick="|handleAdminReturn('${orderInfo.id}', 'APPROVE')|"
                                         title="Chấp nhận trả hàng & hoàn kho">
                                    <i class="fas fa-check"></i> Duyệt
                                 </button>
                                 <button th:if="${orderInfo.status == 'RETURN_PENDING'}" 
                                         class="btn btn-sm btn-danger font-weight-bold" 
                                         style="border-radius: 6px;"
                                         th:onclick="|handleAdminReturn('${orderInfo.id}', 'REJECT')|"
                                         title="Từ chối trả hàng">
                                    <i class="fas fa-ban"></i> Từ chối
                                 </button>
                              </th:block>
                           </div>
                        </td>
                     </tr>
                  </tbody>
               </table>
            </div>
         </div>

         <!-- Pagination -->
         <div class="page-navigator" th:if="${paginationResult.totalPages > 1}">
            <th:block th:each="page : ${paginationResult.navigationPages}">
               <a th:if="${page != -1}" class="nav-item"
                  th:classappend="${page == paginationResult.currentPage} ? 'active' : ''"
                  th:href="@{|/admin/orderList?page=${page}|}" th:utext="${page}"></a>
               <span th:if="${page == -1}" class="nav-item">...</span>
            </th:block>
         </div>
      </div>

      <!-- Modal Yêu Cầu Trả Hàng -->
      <div class="modal fade" id="userReturnModal" tabindex="-1" role="dialog" aria-hidden="true">
         <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
               <div class="modal-header bg-warning text-dark font-weight-bold p-3 px-4" style="border-radius: 16px 16px 0 0;">
                  <h5 class="modal-title font-weight-bold mb-0" style="font-size: 16px;">
                     <i class="fas fa-undo mr-2"></i> Yêu Cầu Trả Hàng / Hoàn Tiền
                  </h5>
                  <button type="button" class="close" data-dismiss="modal" aria-label="Close" style="outline:none;">
                     <span aria-hidden="true">&times;</span>
                  </button>
               </div>
               <div class="modal-body p-4 bg-light">
                  <form id="returnRequestForm" onsubmit="submitReturnRequest(event)">
                     <input type="hidden" id="return-order-id">
                     <div class="form-group mb-3">
                        <label class="font-weight-bold small text-dark">Lý do trả hàng <span class="text-danger">*</span></label>
                        <textarea id="return-reason" class="form-control" rows="3" placeholder="Nhập chi tiết lý do trả hàng (vd: Giày không vừa size, lỗi sản xuất, không đúng mô tả...)" required style="border-radius: 8px;"></textarea>
                     </div>
                     <div class="form-group mb-3">
                        <label class="font-weight-bold small text-dark">Link hình ảnh bằng chứng (Tùy chọn)</label>
                        <input type="url" id="return-image-url" class="form-control" placeholder="https://example.com/proof.jpg" style="border-radius: 8px;">
                     </div>
                     <button type="submit" class="btn btn-warning font-weight-bold btn-block py-2" style="border-radius: 8px;">
                        <i class="fas fa-paper-plane mr-1"></i> Gửi Yêu Cầu Trả Hàng
                     </button>
                  </form>
               </div>
            </div>
         </div>
      </div>

      <th:block th:include="_footer"></th:block>

      <script>
         function cancelOrder(orderId) {
            if (!confirm('Bạn có chắc chắn muốn HỦY đơn hàng #' + orderId + '? Số lượng sản phẩm sẽ được tự động hoàn lại vào kho.')) {
               return;
            }
            fetch('/api/v1/orders/' + orderId + '/cancel', { method: 'POST' })
               .then(res => res.json())
               .then(data => {
                  if (data.success) {
                     alert(data.message);
                     location.reload();
                  } else {
                     alert(data.message || 'Không thể hủy đơn hàng!');
                  }
               })
               .catch(err => alert('Lỗi kết nối máy chủ!'));
         }

         function openReturnModal(orderId) {
            document.getElementById('return-order-id').value = orderId;
            document.getElementById('returnRequestForm').reset();
            $('#userReturnModal').modal('show');
         }

         function submitReturnRequest(event) {
            event.preventDefault();
            var orderId = document.getElementById('return-order-id').value;
            var reason = document.getElementById('return-reason').value.trim();
            var imageUrl = document.getElementById('return-image-url').value.trim();

            if (!reason) {
               alert('Vui lòng nhập lý do trả hàng!');
               return;
            }

            var payload = { reason: reason, imageUrls: imageUrl };

            fetch('/api/v1/orders/' + orderId + '/return', {
               method: 'POST',
               headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
               if (data.success) {
                  alert(data.message);
                  $('#userReturnModal').modal('hide');
                  location.reload();
               } else {
                  alert(data.message || 'Lỗi gửi yêu cầu!');
               }
            })
            .catch(err => alert('Lỗi kết nối máy chủ!'));
         }

         function handleAdminReturn(orderId, action) {
            var actionText = action === 'APPROVE' ? 'CHẤP NHẬN trả hàng & hoàn kho' : 'TỪ CHỐI trả hàng';
            var note = prompt('Nhập ghi chú Admin cho quyết định ' + actionText + ' (nếu có):');
            if (note === null) return; // User cancelled prompt

            var payload = { action: action, adminNote: note };

            fetch('/api/v1/admin/orders/' + orderId + '/return-status', {
               method: 'PUT',
               headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
               if (data.success) {
                  alert(data.message);
                  location.reload();
               } else {
                  alert(data.message || 'Lỗi xử lý!');
               }
            })
            .catch(err => alert('Lỗi kết nối máy chủ!'));
         }
      </script>
   </body>
</html>
