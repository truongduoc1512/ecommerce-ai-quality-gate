<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>ShoeShop — Quên Mật Khẩu</title>
      <link rel="stylesheet" type="text/css" th:href="@{/style.css}" />
      <th:block th:include="_header"></th:block>
      <style type="text/css">
         @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
         :root {
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --radius-md: 12px;
            --radius-lg: 16px;
            --color-bg:             #F8FAFC;
            --color-card:           #FFFFFF;
            --color-primary:        #2563EB;
            --color-primary-hover:  #1D4ED8;
            --color-primary-light:  #EFF6FF;
            --color-danger:         #DC2626;
            --color-border:         #E2E8F0;
            --color-text:           #0F172A;
            --color-text-secondary: #475569;
            --color-text-muted:     #94A3B8;
            --shadow-soft:   0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.02);
            --shadow-lg:     0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.02);
            --transition: 200ms ease-in-out;
         }

         body {
            background-color: var(--color-bg);
            font-family: var(--font-family);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
         }

         .auth-page-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 16px;
         }

         .auth-card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 40px;
            width: 100%;
            max-width: 440px;
         }

         .auth-header {
            text-align: center;
            margin-bottom: 28px;
         }

         .brand-logo-wrapper {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: #FEF3C7;
            color: #D97706;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin: 0 auto 16px auto;
            box-shadow: var(--shadow-soft);
         }

         .auth-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--color-text);
            margin: 0 0 8px 0;
         }

         .auth-subtitle {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin: 0;
            line-height: 1.5;
         }

         .auth-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
         }

         .form-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
         }

         .form-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--color-text-secondary);
            text-transform: uppercase;
         }

         .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
         }

         .input-icon {
            position: absolute;
            left: 14px;
            color: var(--color-text-muted);
            font-size: 14px;
            pointer-events: none;
         }

         .form-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background-color: #F8FAFC;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-md);
            font-family: var(--font-family);
            font-size: 14px;
            color: var(--color-text);
            outline: none;
            transition: var(--transition);
         }

         .form-input:focus {
            background-color: var(--color-card);
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
         }

         .btn-submit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background-color: var(--color-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-family);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-soft);
            margin-top: 8px;
         }
         .btn-submit:hover {
            background-color: var(--color-primary-hover);
         }

         .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--color-text-secondary);
         }
         .auth-footer a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 700;
         }
      </style>
   </head>
   <body>
      <th:block th:include="_menu"></th:block>
      
      <div class="auth-page-container">
         <div class="auth-card">
            <div class="auth-header">
               <div class="brand-logo-wrapper">
                  <i class="fas fa-key"></i>
               </div>
               <h2 class="auth-title">Quên Mật Khẩu?</h2>
               <p class="auth-subtitle">Nhập địa chỉ email đăng ký để nhận mã khôi phục mật khẩu tài khoản</p>
            </div>

            <div th:if="${errorMessage != null}" style="background:#FEF2F2; border:1px solid #FECACA; color:#DC2626; padding:12px; border-radius:8px; margin-bottom:16px; font-size:14px;">
               <i class="fas fa-exclamation-circle"></i> <span th:utext="${errorMessage}"></span>
            </div>

            <div th:if="${successMessage != null}" style="background:#ECFDF5; border:1px solid #A7F3D0; color:#047857; padding:14px; border-radius:8px; margin-bottom:16px; font-size:14px; line-height:1.5;">
               <i class="fas fa-check-circle"></i> <span th:utext="${successMessage}"></span>
               <div th:if="${resetToken != null}" style="margin-top:12px;">
                  <a th:href="@{/resetPassword(token=${resetToken})}" class="btn-submit" style="text-decoration:none; display:inline-block; text-align:center; padding:10px;">
                     Tiếp tục đặt lại mật khẩu mới <i class="fas fa-arrow-right"></i>
                  </a>
               </div>
            </div>

            <form th:action="@{/forgotPassword}" method="POST" class="auth-form" th:if="${successMessage == null}">
               <div class="form-item">
                  <label class="form-label">Địa chỉ Email</label>
                  <div class="input-wrapper">
                     <span class="input-icon"><i class="fas fa-envelope"></i></span>
                     <input type="email" name="email" placeholder="Nhập email của bạn (ví dụ: employee1@shoeshop.com)..." class="form-input" required />
                  </div>
               </div>

               <button type="submit" class="btn-submit">
                  Gửi yêu cầu khôi phục <i class="fas fa-paper-plane"></i>
               </button>
            </form>

            <div class="auth-footer">
               Quay lại <a th:href="@{/admin/login}">Đăng nhập</a>
            </div>
         </div>
      </div>
      
      <th:block th:include="_footer"></th:block>
   </body>
</html>
