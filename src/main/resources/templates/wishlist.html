<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">

<head>
   <meta charset="UTF-8">
   <title>Sản Phẩm Yêu Thích - ShoeShop</title>
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <!-- Fonts & FontAwesome Icons -->
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
   
   <!-- Bootstrap 4.6 CSS -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

   <style>
      :root {
         --color-primary: #2563EB;
         --color-primary-dark: #1D4ED8;
         --color-bg: #F8FAFC;
         --color-surface: #FFFFFF;
         --color-text-main: #0F172A;
         --color-text-muted: #64748B;
         --color-border: #E2E8F0;
         --radius-lg: 16px;
         --radius-md: 12px;
         --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
         --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
      }

      body {
         font-family: 'Inter', sans-serif;
         background-color: var(--color-bg);
         color: var(--color-text-main);
         min-height: 100vh;
         display: flex;
         flex-direction: column;
      }

      .wishlist-hero {
         background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
         color: #fff;
         padding: 48px 0;
         margin-bottom: 40px;
      }

      .wishlist-hero h1 {
         font-weight: 800;
         font-size: 28px;
         letter-spacing: -0.5px;
      }

      .wishlist-grid {
         display: grid;
         grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
         gap: 24px;
         margin-bottom: 60px;
      }

      .wishlist-card {
         background: var(--color-surface);
         border-radius: var(--radius-lg);
         border: 1px solid var(--color-border);
         overflow: hidden;
         transition: all 0.25s ease;
         position: relative;
         display: flex;
         flex-direction: column;
      }

      .wishlist-card:hover {
         transform: translateY(-4px);
         box-shadow: var(--shadow-md);
      }

      .wishlist-img-wrapper {
         position: relative;
         width: 100%;
         padding-top: 80%;
         background-color: #F1F5F9;
         overflow: hidden;
      }

      .wishlist-img-wrapper img {
         position: absolute;
         top: 0; left: 0; width: 100%; height: 100%;
         object-fit: cover;
         transition: transform 0.3s;
      }

      .wishlist-card:hover .wishlist-img-wrapper img {
         transform: scale(1.05);
      }

      .btn-remove-wishlist {
         position: absolute;
         top: 12px;
         right: 12px;
         width: 34px;
         height: 34px;
         border-radius: 50%;
         background: rgba(255,255,255,0.9);
         border: none;
         color: #EF4444;
         display: flex;
         align-items: center;
         justify-content: center;
         cursor: pointer;
         box-shadow: 0 2px 8px rgba(0,0,0,0.15);
         transition: all 0.2s;
         z-index: 2;
      }

      .btn-remove-wishlist:hover {
         background: #EF4444;
         color: #fff;
         transform: scale(1.1);
      }

      .wishlist-body {
         padding: 20px;
         display: flex;
         flex-direction: column;
         flex: 1;
      }

      .wishlist-title {
         font-size: 15px;
         font-weight: 700;
         color: var(--color-text-main);
         margin-bottom: 8px;
         text-decoration: none !important;
         display: -webkit-box;
         -webkit-line-clamp: 2;
         -webkit-box-orient: vertical;
         overflow: hidden;
      }

      .wishlist-title:hover {
         color: var(--color-primary);
      }

      .wishlist-price-row {
         display: flex;
         align-items: center;
         gap: 8px;
         margin-bottom: 16px;
         margin-top: auto;
      }

      .wishlist-price {
         font-size: 18px;
         font-weight: 800;
         color: var(--color-primary);
      }

      .btn-add-cart-wishlist {
         width: 100%;
         padding: 10px 16px;
         border-radius: var(--radius-md);
         background: var(--color-primary);
         color: #fff;
         font-weight: 700;
         font-size: 13.5px;
         border: none;
         text-align: center;
         text-decoration: none !important;
         display: inline-flex;
         align-items: center;
         justify-content: center;
         gap: 8px;
         transition: background-color 0.2s;
      }

      .btn-add-cart-wishlist:hover {
         background: var(--color-primary-dark);
         color: #fff;
      }

      .empty-state {
         text-align: center;
         padding: 80px 20px;
         background: #fff;
         border-radius: var(--radius-lg);
         border: 1px dashed var(--color-border);
         margin-bottom: 60px;
      }

      .empty-icon {
         font-size: 56px;
         color: #CBD5E1;
         margin-bottom: 16px;
      }
   </style>
</head>

<body>
   <th:block th:include="_menu"></th:block>

   <!-- Hero Banner -->
   <div class="wishlist-hero">
      <div class="container">
         <div class="d-flex align-items-center justify-content-between">
            <div>
               <h1><i class="fas fa-heart text-danger mr-2"></i> Danh Sách Sản Phẩm Yêu Thích</h1>
               <p class="text-muted mb-0" style="color: #94A3B8 !important;">Quản lý và xem lại các mẫu giày bạn đã lưu</p>
            </div>
            <div>
               <span class="badge badge-pill badge-primary p-2 px-3" style="font-size: 14px; background-color: var(--color-primary);"
                     th:text="${wishlistCount} + ' Sản phẩm'">0 Sản phẩm</span>
            </div>
         </div>
      </div>
   </div>

   <!-- Main Content -->
   <div class="container" style="flex: 1;">
      
      <!-- Empty Wishlist State -->
      <div th:if="${#lists.isEmpty(wishlistProducts)}" class="empty-state">
         <i class="far fa-heart empty-icon"></i>
         <h4 class="font-weight-bold mb-2">Danh sách yêu thích đang trống</h4>
         <p class="text-muted mb-4">Hãy thả tim các sản phẩm bạn ưa thích để lưu lại và mua sau dễ dàng!</p>
         <a th:href="@{/productList}" class="btn btn-primary font-weight-bold px-4 py-2" style="border-radius: 10px;">
            <i class="fas fa-shopping-bag mr-2"></i> Khám Phá Sản Phẩm Ngay
         </a>
      </div>

      <!-- Wishlist Product Cards Grid -->
      <div th:if="${not #lists.isEmpty(wishlistProducts)}" class="wishlist-grid" id="wishlist-container">
         <div th:each="prod : ${wishlistProducts}" class="wishlist-card" th:id="'wishlist-card-' + ${prod.code}">
            
            <!-- Remove Button -->
            <button type="button" class="btn-remove-wishlist" title="Xóa khỏi yêu thích" 
                    th:data-code="${prod.code}" onclick="removeFromWishlistPage(this)">
               <i class="fas fa-times"></i>
            </button>

            <!-- Image -->
            <div class="wishlist-img-wrapper">
               <a th:href="@{|/productDetail?code=${prod.code}|}">
                  <img th:src="@{|/productImage?code=${prod.code}|}" th:alt="${prod.name}" />
               </a>
            </div>

            <!-- Body -->
            <div class="wishlist-body">
               <a th:href="@{|/productDetail?code=${prod.code}|}" class="wishlist-title" th:text="${prod.name}">Tên sản phẩm</a>
               
               <div class="wishlist-price-row">
                  <span class="wishlist-price" th:text="${#numbers.formatDecimal(prod.price * 1000, 0, 'COMMA', 0, 'POINT')} + ' ₫'">350.000 ₫</span>
                  <span th:if="${prod.stockQuantity <= 0}" class="badge badge-danger">Hết hàng</span>
               </div>

               <!-- Add to Cart -->
               <a th:if="${prod.stockQuantity > 0}" th:href="@{|/buyProduct?code=${prod.code}|}" class="btn-add-cart-wishlist">
                  <i class="fas fa-cart-plus"></i> Thêm Vào Giỏ Hàng
               </a>
               <button th:if="${prod.stockQuantity <= 0}" disabled class="btn-add-cart-wishlist" style="background-color: #94A3B8; cursor: not-allowed;">
                  <i class="fas fa-ban"></i> Sản Phẩm Hết Hàng
               </button>
            </div>
         </div>
      </div>
   </div>

   <!-- Footer -->
   <th:block th:include="_footer"></th:block>

   <script>
      function removeFromWishlistPage(btn) {
         var code = btn.getAttribute('data-code');
         if (!code) return;
         if (!confirm('Bạn có chắc chắn muốn xóa sản phẩm này khỏi danh sách yêu thích?')) return;
         btn.disabled = true;
         fetch('/api/v1/wishlist/' + code, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
               btn.disabled = false;
               if (data && data.success) {
                  var card = document.getElementById('wishlist-card-' + code);
                  if (card) card.remove();
                  if (data.wishlistCount !== undefined && typeof updateWishlistCountBadge === 'function') {
                     updateWishlistCountBadge(data.wishlistCount);
                  }
                  var container = document.getElementById('wishlist-container');
                  if (container && container.children.length === 0) {
                     window.location.reload();
                  }
                  if (typeof showToastNotification === 'function') {
                     showToastNotification('Đã xóa sản phẩm khỏi danh sách yêu thích!', 'success');
                  }
               }
            }).catch(err => { btn.disabled = false; });
      }
   </script>
</body>
</html>
