<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>ShoeShop — Chi tiết Đơn hàng</title>
      <link rel="stylesheet" type="text/css" th:href="@{/style.css}" />
      <th:block th:include="_header"></th:block>
      <style>
         @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

         /* ----------------------------------------------------------
            Design Tokens
         ---------------------------------------------------------- */
         :root {
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-size-xs:   12px;
            --font-size-sm:   13.5px;
            --font-size-base: 15px;
            --font-size-md:   17px;
            --font-size-lg:   20px;
            --font-size-xl:   24px;

            --sp-1: 8px;
            --sp-2: 16px;
            --sp-3: 24px;
            --sp-4: 32px;

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;

            --color-bg:             #F8FAFC;
            --color-card:           #FFFFFF;
            --color-primary:        #2563EB;
            --color-primary-hover:  #1D4ED8;
            --color-primary-light:  #EFF6FF;
            --color-success:        #16A34A;
            --color-success-light:  #ECFDF5;
            --color-danger:         #DC2626;
            --color-danger-light:   #FEF2F2;
            --color-warning:        #F59E0B;
            --color-warning-light:  #FEF3C7;
            --color-border:         #E2E8F0;
            --color-text:           #0F172A;
            --color-text-secondary: #475569;
            --color-text-muted:     #94A3B8;

            --shadow-soft:   0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.02);
            --shadow-md:     0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg:     0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.02);

            --transition: 200ms ease-in-out;
         }

         body {
            background-color: var(--color-bg);
            font-family: var(--font-family);
            color: var(--color-text);
            margin: 0;
            padding: 0;
         }

         h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-family) !important;
         }

         .dash-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--sp-4) var(--sp-2);
         }

         /* Header Row */
         .detail-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--sp-3);
         }
         .detail-title {
            font-size: var(--font-size-xl);
            font-weight: 800;
            color: var(--color-text);
            margin: 0;
            letter-spacing: -0.5px;
         }
         .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background-color: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            color: var(--color-text-secondary);
            font-weight: 600;
            font-size: var(--font-size-sm);
            text-decoration: none;
            box-shadow: var(--shadow-soft);
            transition: var(--transition);
         }
         .btn-back:hover {
            background-color: var(--color-bg);
            color: var(--color-primary);
            border-color: var(--color-primary);
         }

         /* Split Grid Layout */
         .detail-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: var(--sp-3);
            align-items: start;
         }

         /* Card designs */
         .detail-card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 24px;
            margin-bottom: var(--sp-3);
         }
         .card-title {
            font-size: var(--font-size-md);
            font-weight: 700;
            color: var(--color-text);
            margin: 0 0 20px 0;
            padding-bottom: 12px;
            border-bottom: 1.5px solid #F1F5F9;
            display: flex;
            align-items: center;
            gap: 10px;
         }
         .card-title i {
            color: var(--color-primary);
         }

         /* Info Fields */
         .info-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
         }
         .info-row {
            display: flex;
            align-items: center;
            gap: 12px;
         }
         .info-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #F1F5F9;
            color: var(--color-text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
         }
         .info-details {
            display: flex;
            flex-direction: column;
         }
         .info-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--color-text-secondary);
            letter-spacing: 0.5px;
         }
         .info-value {
            font-size: var(--font-size-sm);
            color: var(--color-text);
            font-weight: 500;
            margin-top: 2px;
         }

         /* Order Summary block */
         .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dashed var(--color-border);
         }
         .summary-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
         }
         .summary-label {
            font-weight: 500;
            color: var(--color-text-secondary);
         }
         .summary-value {
            font-weight: 700;
            color: var(--color-text);
         }
         .summary-value.total-price {
            font-size: var(--font-size-lg);
            color: var(--color-primary);
         }

         /* Status badge */
         .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
         }
         .status-pending {
            background-color: var(--color-warning-light);
            color: var(--color-warning);
         }
         .status-completed, .status-delivered {
            background-color: var(--color-success-light);
            color: var(--color-success);
         }
         .status-cancelled, .status-rejected {
            background-color: var(--color-danger-light);
            color: var(--color-danger);
         }
         .status-shipping {
            background-color: var(--color-primary-light);
            color: var(--color-primary);
         }

         /* Status Form */
         .status-form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1.5px solid #F1F5F9;
         }
         .status-form-title {
            font-size: var(--font-size-sm);
            font-weight: 700;
            color: var(--color-text);
         }
         .status-form-wrapper {
            display: flex;
            gap: 12px;
         }
         .select-status {
            flex-grow: 1;
            padding: 10px 14px;
            border: 1.5px solid var(--color-border);
            border-radius: var(--radius-md);
            font-family: var(--font-family);
            font-size: var(--font-size-sm);
            color: var(--color-text);
            outline: none;
            transition: var(--transition);
         }
         .select-status:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
         }
         .btn-update {
            padding: 10px 20px;
            background-color: var(--color-primary);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-family);
            font-size: var(--font-size-sm);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
         }
         .btn-update:hover {
            background-color: var(--color-primary-hover);
         }

         /* Products Table style */
         .products-table {
            width: 100%;
            border-collapse: collapse;
         }
         .products-table th {
            padding: 14px 16px;
            background-color: #F8FAFC;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--color-text-secondary);
            border-bottom: 1px solid var(--color-border);
            text-align: left;
         }
         .products-table td {
            padding: 16px;
            font-size: var(--font-size-sm);
            color: var(--color-text);
            border-bottom: 1px solid var(--color-border);
            vertical-align: middle;
         }
         .products-table tr:last-child td {
            border-bottom: none;
         }
         .prod-code {
            font-family: monospace;
            font-weight: 600;
            background-color: #F1F5F9;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            color: var(--color-text);
         }
         .prod-name {
            font-weight: 500;
            color: var(--color-text);
         }

         /* Responsive */
         @media (max-width: 992px) {
            .detail-grid {
               grid-template-columns: 1fr;
            }
         }
      </style>
   </head>
   <body>
      <th:block th:include="_menu"></th:block>
      
      <div class="dash-container">
         <div class="detail-header-row">
            <h1 class="detail-title" th:utext="'Đơn hàng #' + ${orderInfo.orderNum}">Đơn hàng</h1>
            <a th:href="@{/admin/orderList}" class="btn-back">
               <i class="fas fa-arrow-left"></i> Danh sách đơn hàng
            </a>
         </div>

         <!-- Alert messages -->
         <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert" style="border-radius: var(--radius-md); font-size: var(--font-size-sm); font-family: var(--font-family);">
            <span th:utext="${message}"></span>
         </div>
         <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert" style="border-radius: var(--radius-md); font-size: var(--font-size-sm); font-family: var(--font-family);">
            <span th:utext="${errorMessage}"></span>
         </div>

         <div class="detail-grid">
            <!-- Left Column: Products List -->
            <div class="detail-card" style="padding: 0; overflow: hidden;">
               <div style="padding: 24px 24px 12px 24px;">
                  <h3 class="card-title" style="border-bottom: none; margin-bottom: 0;">
                     <i class="fas fa-shopping-basket"></i> Danh sách sản phẩm mua sắm
                  </h3>
               </div>
               <div class="table-responsive">
                  <table class="products-table">
                     <thead>
                        <tr>
                           <th>Mã sản phẩm</th>
                           <th>Tên sản phẩm</th>
                           <th>Số lượng</th>
                           <th>Đơn giá</th>
                           <th>Thành tiền</th>
                        </tr>
                     </thead>
                     <tbody>
                        <tr th:each="orderDetailInfo : ${orderInfo.details}">
                           <td>
                              <span class="prod-code" th:utext="${orderDetailInfo.productCode}"></span>
                           </td>
                           <td>
                              <span class="prod-name" th:utext="${orderDetailInfo.productName}"></span>
                           </td>
                           <td style="font-weight: 600;" th:utext="${orderDetailInfo.quanity}"></td>
                            <td th:utext="${#numbers.formatDecimal(orderDetailInfo.price * 1000, 1, 'POINT', 0, 'POINT')} + ' ₫'"></td>
                            <td style="font-weight: 700;" th:utext="${#numbers.formatDecimal(orderDetailInfo.amount * 1000, 1, 'POINT', 0, 'POINT')} + ' ₫'"></td>
                        </tr>
                     </tbody>
                  </table>
               </div>
            </div>

            <!-- Right Column: Customer Info & Status -->
            <div>
               <!-- Customer Info -->
               <div class="detail-card">
                  <h3 class="card-title">
                     <i class="fas fa-user-circle"></i> Thông tin khách hàng
                  </h3>
                  <div class="info-group">
                     <div class="info-row">
                        <div class="info-icon">
                           <i class="fas fa-user"></i>
                        </div>
                        <div class="info-details">
                           <span class="info-label">Họ và tên</span>
                           <span class="info-value" th:utext="${orderInfo.customerName}"></span>
                        </div>
                     </div>
                     <div class="info-row">
                        <div class="info-icon">
                           <i class="fas fa-envelope"></i>
                        </div>
                        <div class="info-details">
                           <span class="info-label">Địa chỉ Email</span>
                           <span class="info-value" th:utext="${orderInfo.customerEmail}"></span>
                        </div>
                     </div>
                     <div class="info-row">
                        <div class="info-icon">
                           <i class="fas fa-phone"></i>
                        </div>
                        <div class="info-details">
                           <span class="info-label">Số điện thoại</span>
                           <span class="info-value" th:utext="${orderInfo.customerPhone}"></span>
                        </div>
                     </div>
                     <div class="info-row">
                        <div class="info-icon">
                           <i class="fas fa-map-marker-alt"></i>
                        </div>
                        <div class="info-details">
                           <span class="info-label">Địa chỉ nhận hàng</span>
                           <span class="info-value" th:utext="${orderInfo.customerAddress}"></span>
                        </div>
                     </div>
                  </div>
               </div>

               <!-- Order Summary -->
               <div class="detail-card">
                  <h3 class="card-title">
                     <i class="fas fa-receipt"></i> Tóm tắt đơn hàng
                  </h3>
                  <div class="summary-row">
                     <span class="summary-label">Trạng thái</span>
                     <span th:class="'status-badge status-' + ${#strings.toLowerCase(orderInfo.status)}" th:utext="${orderInfo.status}">PENDING</span>
                  </div>
                  <div class="summary-row">
                     <span class="summary-label">Tổng thanh toán</span>
                      <span class="summary-value total-price" th:utext="${#numbers.formatDecimal(orderInfo.amount * 1000, 1, 'POINT', 0, 'POINT')} + ' ₫'"></span>
                  </div>

                  <!-- Form update status (Only visible to admin/employee) -->
                  <div class="status-form-group" sec:authorize="hasRole('ROLE_ADMIN')">
                     <span class="status-form-title"><i class="fas fa-edit"></i> Cập nhật trạng thái</span>
                     <form th:action="@{/admin/order/updateStatus}" method="POST" class="status-form-wrapper">
                        <input type="hidden" name="orderId" th:value="${orderInfo.id}" />
                        <select name="status" class="select-status">
                           <option value="PENDING" th:selected="${orderInfo.status == 'PENDING'}">Chờ xử lý</option>
                           <option value="SHIPPING" th:selected="${orderInfo.status == 'SHIPPING'}">Đang giao hàng</option>
                           <option value="COMPLETED" th:selected="${orderInfo.status == 'COMPLETED'}">Hoàn thành</option>
                           <option value="CANCELLED" th:selected="${orderInfo.status == 'CANCELLED'}">Đã hủy</option>
                        </select>
                        <button type="submit" class="btn-update">Lưu</button>
                     </form>
                  </div>
               </div>
            </div>
         </div>
      </div>

      <th:block th:include="_footer"></th:block>
   </body>
</html>
