<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Hồ Sơ Cá Nhân — ShoeShop</title>
      <link rel="stylesheet" type="text/css" th:href="@{/style.css}" />
      <th:block th:include="_header"></th:block>
      <style>
         .profile-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #E2E8F0;
            padding: 32px;
         }
         .profile-header {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid #F1F5F9;
            margin-bottom: 32px;
         }
         .profile-avatar-large {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #EFF6FF;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
         }
         .profile-avatar-placeholder {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
         }
         .form-group label {
            font-weight: 600;
            color: #334155;
            font-size: 14px;
            margin-bottom: 8px;
         }
         .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid #CBD5E1;
            font-size: 14px;
            transition: all 0.2s ease;
         }
         .form-control:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
         }
         .btn-save {
            background: #2563EB;
            color: #ffffff;
            font-weight: 700;
            padding: 12px 28px;
            border-radius: 10px;
            border: none;
            transition: all 0.2s ease;
         }
         .btn-save:hover {
            background: #1D4ED8;
            color: #ffffff;
         }
         .badge-role {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
         }
         .badge-admin { background: #FEF3C7; color: #D97706; }
         .badge-user { background: #E0E7FF; color: #4338CA; }
      </style>
   </head>
   <body class="bg-light">
      <th:block th:include="_menu"></th:block>

      <div class="container my-5" style="max-width: 800px;">
         <div class="profile-card">
            
            <div class="profile-header">
               <div>
                  <img th:if="${account.avatarUrl != null and !#strings.isEmpty(account.avatarUrl)}" 
                       th:src="${account.avatarUrl}" 
                       referrerpolicy="no-referrer"
                       onerror="this.onerror=null; this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';"
                       class="profile-avatar-large" 
                       alt="Avatar" />
                  <div th:style="${account.avatarUrl != null and !#strings.isEmpty(account.avatarUrl)} ? 'display:none;' : ''" 
                       class="profile-avatar-placeholder" 
                       th:text="${#strings.substring(account.fullName != null ? account.fullName : account.userName, 0, 1).toUpperCase()}">
                     A
                  </div>
               </div>
               <div>
                  <h3 class="font-weight-bold text-dark mb-1" th:text="${account.fullName != null ? account.fullName : account.userName}">User Full Name</h3>
                  <div class="d-flex align-items-center gap-2 mt-1" style="gap: 8px;">
                     <span th:if="${account.userRole == 'ROLE_ADMIN' or account.userRole == 'ADMIN'}" class="badge-role badge-admin">Quản trị viên (Admin)</span>
                     <span th:unless="${account.userRole == 'ROLE_ADMIN' or account.userRole == 'ADMIN'}" class="badge-role badge-user">Khách hàng (Customer)</span>
                     <span class="text-muted small" style="font-size: 13px;">• Đăng nhập qua: <strong th:text="${account.provider}">LOCAL</strong></span>
                  </div>
               </div>
            </div>

            <form th:action="@{/admin/user/profile}" th:object="${profileForm}" method="POST">
               <input type="hidden" th:field="*{userName}" />

               <div class="row">
                  <div class="col-md-6 form-group mb-3">
                     <label><i class="far fa-user mr-1 text-primary"></i> Tên tài khoản (Username)</label>
                     <input type="text" class="form-control bg-light" th:value="${account.userName}" readonly />
                  </div>
                  <div class="col-md-6 form-group mb-3">
                     <label><i class="far fa-id-card mr-1 text-primary"></i> Họ và tên</label>
                     <input type="text" class="form-control" th:field="*{fullName}" placeholder="Nhập họ và tên đầy đủ" required />
                  </div>
               </div>

               <div class="row">
                  <div class="col-md-6 form-group mb-3">
                     <label><i class="far fa-envelope mr-1 text-primary"></i> Địa chỉ Email</label>
                     <input type="email" class="form-control" th:field="*{email}" placeholder="example@domain.com" required />
                  </div>
                  <div class="col-md-6 form-group mb-3">
                     <label><i class="fas fa-phone-alt mr-1 text-primary"></i> Số điện thoại</label>
                     <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="0987654321" />
                  </div>
               </div>

               <div class="form-group mb-4">
                  <label><i class="fas fa-image mr-1 text-primary"></i> Đường dẫn ảnh đại diện (Avatar URL)</label>
                  <input type="url" class="form-control" th:field="*{avatarUrl}" placeholder="https://example.com/avatar.jpg" />
                  <small class="form-text text-muted">Dán đường dẫn hình ảnh trực tuyến để thay đổi ảnh đại diện cá nhân.</small>
               </div>

               <!-- Password Change Block for Local Accounts -->
               <div th:if="${account.provider == 'LOCAL' or account.provider == null}" class="card border-0 bg-light p-3 mb-4" style="border-radius: 12px;">
                  <h6 class="font-weight-bold text-dark mb-3"><i class="fas fa-lock text-warning mr-1"></i> Đổi Mật Khẩu</h6>
                  <div class="row">
                     <div class="col-md-4 form-group mb-2">
                        <label>Mật khẩu hiện tại</label>
                        <input type="password" class="form-control" th:field="*{oldPassword}" placeholder="Mật khẩu cũ" />
                     </div>
                     <div class="col-md-4 form-group mb-2">
                        <label>Mật khẩu mới</label>
                        <input type="password" class="form-control" th:field="*{newPassword}" placeholder="Mật khẩu mới" />
                     </div>
                     <div class="col-md-4 form-group mb-2">
                        <label>Xác nhận mật khẩu</label>
                        <input type="password" class="form-control" th:field="*{confirmPassword}" placeholder="Nhập lại mật khẩu mới" />
                     </div>
                  </div>
               </div>

               <div class="d-flex align-items-center justify-content-between pt-2">
                  <a th:href="@{/}" class="btn btn-outline-secondary font-weight-bold px-4 py-2" style="border-radius: 10px;">Quay lại</a>
                  <button type="submit" class="btn btn-save"><i class="fas fa-save mr-2"></i> Lưu thay đổi</button>
               </div>
            </form>

         </div>
      </div>

      <th:block th:include="_footer"></th:block>
   </body>
</html>
