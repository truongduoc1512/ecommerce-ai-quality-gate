version: "3.8"

services:
  ai-shoeshop-db:
    image: mysql:8.0
    container_name: shoeshop-ai-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-truonghoaiduoc5}
      MYSQL_DATABASE: shoe_shopdb
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      shoeshop-ai-net:
        aliases:
          - ai-shoeshop-db
          - shoeshop-ai-mysql
          - shoeshop-mysql

  # 2. AI Quality Gate Microservice (FastAPI + YOLOv8 + OpenCV)
  ai-shoeshop-engine:
    build: 
      context: ./ai-service
    image: shoeshop-ai-engine:latest
    container_name: shoeshop-ai-container
    restart: always
    ports:
      - "8000:8000"
    networks:
      shoeshop-ai-net:
        aliases:
          - ai-shoeshop-engine
          - shoeshop-ai-container
          - ai-service

  # 3. Backend API (Java Spring Boot)
  ai-shoeshop-backend:
    build: .
    image: shoeshop-backend-api:latest
    container_name: shoeshop-ai-api
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://shoeshop-ai-mysql:3306/shoe_shopdb?useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=30000}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-${MYSQL_ROOT_PASSWORD:-truonghoaiduoc5}}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-shoeshop-engine:8000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      shoeshop-ai-net:
        aliases:
          - ai-shoeshop-backend
          - shoeshop-ai-api
          - shoeshop-backend
    depends_on:
      ai-shoeshop-db:
        condition: service_healthy
      ai-shoeshop-engine:
        condition: service_started

  # 4. Nginx Reverse Proxy
  ai-shoeshop-nginx:
    image: nginx:alpine
    container_name: shoeshop-ai-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - ai-shoeshop-backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      shoeshop-ai-net:
        aliases:
          - ai-shoeshop-nginx
          - shoeshop-ai-nginx
          - shoeshop-nginx

networks:
  shoeshop-ai-net:
    driver: bridge

