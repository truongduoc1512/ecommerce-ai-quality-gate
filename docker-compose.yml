version: '3.8'

services:
  # 1. Cơ sở dữ liệu MySQL (Tái sử dụng image mysql:8.0 đã tải)
  ai-shoeshop-db:
    image: mysql:8.0
    container_name: shoeshop-ai-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-truonghoaiduoc5}
      MYSQL_DATABASE: shoe_shopdb
    ports:
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shoeshop-ai-net

  # 2. Khối AI Microservice (FastAPI)
  ai-shoeshop-engine:
    build: 
      context: ./ai-service
    image: shoeshop-ai-engine:latest
    container_name: shoeshop-ai-container
    restart: always
    ports:
      - "8000:8000"
    networks:
      - shoeshop-ai-net

  # 3. Ứng dụng Backend (Java Spring Boot)
  ai-shoeshop-backend:
    build: .
    image: shoeshop-backend-api:latest
    container_name: shoeshop-ai-api
    restart: always
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://ai-shoeshop-db:3306/shoe_shopdb?useSSL=false&allowPublicKeyRetrieval=true}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-root}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-${MYSQL_ROOT_PASSWORD:-truonghoaiduoc5}}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-shoeshop-engine:8000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shoeshop-ai-net
    depends_on:
      ai-shoeshop-db:
        condition: service_healthy
      ai-shoeshop-engine:
        condition: service_started

  # 4. Nginx Reverse Proxy (Tái sử dụng image nginx:alpine đã tải)
  ai-shoeshop-nginx:
    image: nginx:alpine
    container_name: shoeshop-ai-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      ai-shoeshop-backend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - shoeshop-ai-net

networks:
  shoeshop-ai-net:
    driver: bridge